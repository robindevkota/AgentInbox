services:
  - type: web
    name: agentinbox
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install -g pnpm@9.0.0 && pnpm install --frozen-lockfile && cd packages/ui && pnpm build && cd ../../packages/server && pnpm build && node scripts/copy-ui.js
    startCommand: node packages/server/dist/cli.js start
    envVars:
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /opt/render/project/data
    disk:
      name: agentinbox-data
      mountPath: /opt/render/project/data
      sizeGB: 1
