services:
  - type: web
    name: agentinbox
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install -g pnpm@9.0.0 --force && pnpm install --frozen-lockfile && pnpm --filter=@agentinbox/ui build && node packages/server/scripts/copy-ui.js
    startCommand: node packages/server/dist/cli.js start
    envVars:
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: TURSO_URL
        value: libsql://agentinbox-robin-devkota.aws-ap-south-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
